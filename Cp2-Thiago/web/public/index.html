<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamRec</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ============ Tela de perfis ============ -->
  <section id="profiles" class="profiles hidden">
    <div class="logo big">STREAMREC</div>
    <h1>Quem está assistindo?</h1>
    <div id="profile-list" class="profile-list"></div>
    <div class="profile-actions">
      <button id="btn-new-profile" class="btn-outline">+ Adicionar perfil</button>
      <button id="btn-open-profile" class="btn-outline">Entrar com ID</button>
    </div>
    <form id="form-new-profile" class="profile-form hidden">
      <input name="name" placeholder="Nome do perfil" required maxlength="40" />
      <input name="age" type="number" min="0" max="120" placeholder="Idade (opcional)" />
      <button class="btn-red">Criar perfil</button>
    </form>
    <form id="form-open-profile" class="profile-form hidden">
      <input name="id" placeholder="ID do usuário (ex.: u42)" required />
      <button class="btn-red">Entrar</button>
    </form>
    <p id="profile-error" class="form-error"></p>
  </section>

  <!-- ============ Aplicação ============ -->
  <div id="app" class="hidden">
    <header id="topbar" class="topbar">
      <div class="left">
        <a href="#/home" class="logo">STREAMREC</a>
        <nav>
          <a href="#/home" data-nav="home">Início</a>
          <a href="#/top" data-nav="top">Em alta</a>
          <a href="#/genres" data-nav="genres">Gêneros</a>
          <a href="#/history" data-nav="history">Assistidos</a>
          <a href="#/add" data-nav="add">Adicionar título</a>
          <a href="#/cache" data-nav="cache">Painel do cache</a>
        </nav>
      </div>
      <div class="right">
        <div class="search">
          <span>⌕</span>
          <input id="search" placeholder="Títulos, gêneros" autocomplete="off" />
        </div>
        <div class="me" id="me">
          <div class="avatar sm" id="me-avatar"></div>
          <span class="caret">▾</span>
          <div class="menu">
            <div class="menu-name" id="me-name"></div>
            <a href="#" id="switch-profile">Trocar de perfil</a>
          </div>
        </div>
      </div>
    </header>

    <main id="view"></main>

    <footer class="footer">
      StreamRec · Recomendação com Neo4j + Redis + FastAPI ·
      <a href="http://localhost:8000/docs" target="_blank">API (Swagger)</a> ·
      <a href="http://localhost:7474" target="_blank">Neo4j Browser</a>
    </footer>
  </div>

  <!-- ============ Modal do filme ============ -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="modal-close" id="modal-close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- ============ Indicador de cache ============ -->
  <a href="#/cache" id="cache-pill" class="cache-pill hidden"></a>
  <div id="toast" class="toast"></div>

  <script src="js/app.js"></script>
</body>
</html>
